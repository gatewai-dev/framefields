<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Topple · framefields</title>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				background: #0b0c0e;
				color: #8b9099;
				font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
				display: grid;
				place-items: center;
			}
			canvas {
				display: block;
				width: min(100vw, calc(100vh * 16 / 9));
				height: auto;
				aspect-ratio: 16 / 9;
				cursor: crosshair;
				touch-action: none;
			}
			#loading {
				position: absolute;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>
		<div id="loading">Loading the engine and Steel…</div>
		<script type="module" src="/@framefields/player.js"></script>
	</body>
</html>
