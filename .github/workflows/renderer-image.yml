# Builds and publishes the renderer worker image (apps/renderer-service).
#   ghcr.io/gatewai-dev/framefields-renderer:<version>        (slim)
#   ghcr.io/gatewai-dev/framefields-renderer:<version>-full   (with a C/C++ toolchain)
# Runs on tags renderer-v*, or by hand (publish=false only builds).
name: renderer-image

on:
  push:
    tags: ["renderer-v*"]
  pull_request:
    paths:
      - "apps/renderer-service/**"
      - "packages/**"
      - "nodes/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      publish:
        description: Push to GHCR
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/framefields-renderer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y git-lfs ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@framefields/renderer-service...
      - run: pnpm --filter @framefields/renderer-service typecheck
      # GPU tests are skipped here (FF_GPU_TESTS unset); run them on a GPU host.
      - run: pnpm --filter @framefields/renderer-service test
      - run: apps/renderer-service/deploy/known-hosts.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [slim, full]
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version=$(jq -r .version apps/renderer-service/package.json)
          suffix=$([ "${{ matrix.variant }}" = full ] && echo "-full" || echo "")
          echo "tags=${IMAGE}:${version}${suffix},${IMAGE}:latest${suffix}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/renderer-service/Dockerfile
          platforms: linux/amd64
          build-args: VARIANT=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ startsWith(github.ref, 'refs/tags/renderer-v') || inputs.publish == true }}
          load: ${{ matrix.variant == 'slim' }}
          cache-from: type=gha,scope=renderer-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=renderer-${{ matrix.variant }}
      - name: Smoke test (no GPU; checks the image boots its config and tools)
        if: matrix.variant == 'slim'
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | cut -d, -f1)
          docker run --rm --entrypoint bash "$tag" -c 'git --version && git lfs version && ffprobe -version | head -1 && test -s apps/renderer-service/deploy/known_hosts'
